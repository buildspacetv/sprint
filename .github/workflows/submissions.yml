name: Build submissions

# Rebuilds the showcase whenever a submission issue changes. Vercel is linked
# to this repo, so the commit this workflow pushes is what deploys the site.
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.js'
      - 'src/styles.css'
      - 'data/projects.json'
      - 'scripts/sync-issues.js'

concurrency:
  group: submissions
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync submission issues into data/projects.json
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-issues.js

      - name: Generate showcase and project pages
        run: node build.js

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json showcase.html submit.html projects
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Rebuild showcase from submissions [skip ci]"
            git push
          fi

name: Build submissions

# Rebuilds the showcase whenever a submission issue changes. Vercel is linked
# to this repo, so the commit this workflow pushes is what deploys the site.
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Anything that changes what a page says must rebuild the page. This
      # list was five specific files and missed src/pages-extra.js, so an edit
      # made through /edit wrote to source, never rebuilt, and reported itself
      # as published. Watch the directories instead of naming files.
      - 'build.js'
      - 'src/**'
      - 'content/**'
      - 'data/**'
      - 'scripts/**'
      - 'index.html'

concurrency:
  group: submissions
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # only to (re)create the label set below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # An issue template's `labels:` are silently dropped when the label does
      # not already exist in the repo. That failed once on this repo: a team
      # form arrived unlabelled, so the sync found nothing and the site looked
      # broken while every workflow run reported success. Idempotent, so it
      # also self-heals a deleted label.
      - name: Ensure submission labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create team --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 --description "Team directory entry" --force
          gh label create submission --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "Project showcase submission" --force

      - name: Sync submission issues into data/projects.json
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-issues.js

      # The generator escapes untrusted issue content into HTML; a regression
      # here is a stored XSS, so fail the build rather than publish it.
      - name: Run tests
        run: node --test

      - name: Generate showcase and project pages
        run: node build.js

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/projects.json data/teams.json apidata showcase.html submit.html teams.html judge.html projects teams *.md *.txt sitemap.xml openapi.json .well-known about.html contact.html privacy.html developers.html about contact privacy developers
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild showcase from submissions [skip ci]"
          # Two submissions landing close together, or a human pushing at the
          # same time, means this push can be rejected. Giving up there loses
          # a team's project page silently, so rebase onto whatever landed and
          # try again rather than failing the run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the rebuild after 5 attempts"
          exit 1

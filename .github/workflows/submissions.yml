name: Build submissions

# Rebuilds the showcase whenever a submission issue changes. Vercel is linked
# to this repo, so the commit this workflow pushes is what deploys the site.
on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.js'
      - 'src/styles.css'
      - 'data/projects.json'
      - 'data/teams.json'
      - 'scripts/sync-issues.js'

concurrency:
  group: submissions
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # only to (re)create the label set below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # An issue template's `labels:` are silently dropped when the label does
      # not already exist in the repo. That failed once on this repo: a team
      # form arrived unlabelled, so the sync found nothing and the site looked
      # broken while every workflow run reported success. Idempotent, so it
      # also self-heals a deleted label.
      - name: Ensure submission labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create team --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 --description "Team directory entry" --force
          gh label create submission --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB --description "Project showcase submission" --force

      - name: Sync submission issues into data/projects.json
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-issues.js

      # The generator escapes untrusted issue content into HTML; a regression
      # here is a stored XSS, so fail the build rather than publish it.
      - name: Run tests
        run: node --test

      - name: Generate showcase and project pages
        run: node build.js

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/teams.json showcase.html submit.html teams.html projects teams
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Rebuild showcase from submissions [skip ci]"
            git push
          fi
